defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic

wandb:
  project: "wildrobot-rl"

experiment:
  task_factory:
    name: RLFactory
    params: {}
  env_params:
    # Use the MJX (GPU-capable) WildRobot environment
    env_name: MjxWildRobot
    horizon: 1000
    terminal_state_type: HeightBasedTerminalStateHandler
    terminal_state_params:
      min_height: 0.0   # widened bounds to avoid immediate resets
      max_height: 2.0
    goal_type: GoalForwardRootVelocity
    goal_params:
      visualize_goal: true
      # Forward-only locomotion - no backward walking!
      min_x_vel: 0.8      # Minimum forward velocity
      max_x_vel: 2.0      # Maximum forward velocity (increased for faster walking)
      min_y_vel: -0.2     # Reduce lateral wandering
      max_y_vel: 0.2
      min_yaw_vel: -0.3   # Reduce excessive turning
      max_yaw_vel: 0.3
    headless: true
    reward_type: LocomotionReward
    reward_params:
      tracking_w_exp_xy: 6.0   # stronger exponential tracking in xy
      tracking_w_exp_yaw: 4.0
      tracking_w_sum_xy: 3.5   # higher linear contribution for xy tracking
      tracking_w_sum_yaw: 1.0
      air_time_coeff: 0.1
      joint_acc_coeff: 2.0e-05
      air_time_max: 0.5
      joint_torque_coeff: 2.0e-07
      joint_position_limit_coeff: 2.0
      action_rate_coeff: 0.02  # lower to allow more exploratory stepping
      symmetry_air_coeff: 0.005
      energy_coeff: 1.0e-05    # reduce early energy penalty
  hidden_layers: [512, 256]
  lr: 1e-4
  num_envs: 1024
  num_steps: 50
  total_timesteps: 5e7
  update_epochs: 4
  num_minibatches: 32
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.8
  learnable_std: true
  ent_coef: 0.01    # Enable exploration for better gait discovery
  vf_coef: 0.5
  max_grad_norm: 0.5
  activation: tanh
  anneal_lr: false
  weight_decay: 0.0
  normalize_env: true
  debug: false
  # Live W&B streaming (host callbacks from inside JIT)
  live_wandb: true
  live_wandb_interval: 5   # log every N PPO updates
  # Note: training loop is JIT-compiled; live streaming is implemented via host callbacks.
  n_seeds: 1
  vmap_across_seeds: true
  validation:
    active: false
    num_steps: 100
    num_envs: 100
    num: 10
