# COMBINED: RSI + Reward Shaping + Backward Walking Fix
# Uses human poses at reset AND prevents backward walking exploit
# With correct HTD-45H servo parameters (4.0 Nm, damping 0.08516)

defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic

wandb:
  project: "wildrobot-rsi-humanlike-fixed"

# Top-level learning rate (required for ImitationFactory)
lr: 5e-5

experiment:
  task_factory:
    name: ImitationFactory  # Load AMASS for poses
    params:
      amass_dataset_conf:
        rel_dataset_path:
          - "KIT/3/walking_medium03_poses"
          - "KIT/3/walking_slow08_poses"
          - "KIT/3/walking_fast02_poses"

  env_params:
    env_name: MjxWildRobot
    horizon: 600
    headless: true

    # === RSI: Use human poses at reset ===
    initial_state_type: TrajectoryInitialStateHandler
    initial_state_params:
      sample_from_trajectory: true  # Sample random frames
      noise_std: 0.1                # Add noise to avoid exact copying

    # === Standard RL goal (HIGHER minimum velocity) ===
    goal_type: GoalForwardRootVelocity
    goal_params:
      visualize_goal: false
      min_x_vel: 0.5     # Was 0.3 - force faster walking!
      max_x_vel: 1.0     # Was 0.8 - allow faster speeds
      min_y_vel: -0.1
      max_y_vel: 0.1
      min_yaw_vel: -0.2
      max_yaw_vel: 0.2

    # === ULTRA-AGGRESSIVE VELOCITY TRACKING (Force forward walking) ===
    reward_type: LocomotionReward
    reward_params:
      # MASSIVELY INCREASED velocity tracking weights
      tracking_w_exp_xy: 100.0      # Was 20.0 - increase 5x!
      tracking_w_exp_yaw: 10.0       # Was 4.0
      tracking_w_sum_xy: 50.0        # Was 10.0 - increase 5x!
      tracking_w_sum_yaw: 2.0        # Was 1.0

      # MINIMIZE all penalties (make velocity tracking dominate completely)
      z_vel_coeff: 0.3               # Was 1.0 - reduce 70%
      roll_pitch_vel_coeff: 0.01     # Was 0.05 - reduce 80%
      roll_pitch_pos_coeff: 0.05     # Was 0.2 - reduce 75%

      # Smoothness (reduce to near-zero)
      nominal_joint_pos_coeff: 0.001      # Was 0.005
      joint_position_limit_coeff: 1.0     # Was 5.0
      joint_vel_coeff: 1e-5               # Was 5e-5
      joint_acc_coeff: 5e-6               # Was 2e-5
      joint_torque_coeff: 1e-7            # Was 2e-7
      action_rate_coeff: 0.005            # Was 0.02

      # Gait pattern (keep minimal)
      air_time_max: 0.15
      air_time_coeff: 0.05           # Was 0.2 - reduce
      symmetry_air_coeff: 0.02       # Was 0.1 - reduce

      # Energy (minimal)
      energy_coeff: 1e-6             # Was 1e-5

    # === Tighter terminal bounds (prevent crouching/jumping) ===
    terminal_state_type: HeightBasedTerminalStateHandler
    terminal_state_params:
      min_height: 0.15              # Was 0.0 - prevent low crouching
      max_height: 0.7               # Was 2.0 - more realistic

  # === FULL TRAINING PARAMETERS ===
  hidden_layers: [512, 256, 128]
  lr: 5e-5                         # Learning rate (also at root level)
  num_envs: 2048
  num_steps: 64
  total_timesteps: 2e7             # 20 million steps
  update_epochs: 4
  num_minibatches: 32
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.6
  learnable_std: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  activation: tanh
  anneal_lr: true
  weight_decay: 0.0
  normalize_env: true
  debug: false
  live_wandb: true
  live_wandb_interval: 5
  n_seeds: 1
  vmap_across_seeds: true
  validation:
    active: false
    num: 1                       # Required even when active=false
    num_steps: 100
    num_envs: 10
