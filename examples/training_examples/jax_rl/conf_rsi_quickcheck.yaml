# QUICK VERIFICATION: RSI + Humanlike PPO
# Fast sanity check before full training (~10 minutes instead of 3-4 hours)
# Use this to verify: AMASS loads, RSI works, training starts, basic learning happens

defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic

wandb:
  project: "wildrobot-rsi-quickcheck"

# Top-level learning rate (required for ImitationFactory)
lr: 5e-5

experiment:
  task_factory:
    name: ImitationFactory  # Load AMASS for poses
    params:
      amass_dataset_conf:
        rel_dataset_path:
          - "KIT/3/walking_medium03_poses"  # Just one dataset for speed

  env_params:
    env_name: MjxWildRobot
    horizon: 600
    headless: true

    # === RSI: Use human poses at reset ===
    initial_state_type: TrajectoryInitialStateHandler
    initial_state_params:
      sample_from_trajectory: true  # Sample random frames
      noise_std: 0.1                # Add noise to avoid exact copying

    # === Standard RL goal (NOT trajectory tracking!) ===
    goal_type: GoalForwardRootVelocity
    goal_params:
      visualize_goal: false
      min_x_vel: 0.3     # Human walking speed
      max_x_vel: 0.8
      min_y_vel: -0.1
      max_y_vel: 0.1
      min_yaw_vel: -0.2
      max_yaw_vel: 0.2

    # === Human-like reward shaping ===
    reward_type: LocomotionReward
    reward_params:
      # Velocity tracking
      tracking_w_exp_xy: 10.0
      tracking_w_exp_yaw: 4.0
      tracking_w_sum_xy: 3.5
      tracking_w_sum_yaw: 1.0

      # Stability (upright, smooth)
      z_vel_coeff: 3.0
      roll_pitch_vel_coeff: 0.1
      roll_pitch_pos_coeff: 0.5

      # Smooth motion
      nominal_joint_pos_coeff: 0.01
      joint_position_limit_coeff: 10.0
      joint_vel_coeff: 1e-4
      joint_acc_coeff: 5e-5
      joint_torque_coeff: 5e-7
      action_rate_coeff: 0.05

      # Natural gait
      air_time_max: 0.15
      air_time_coeff: 0.2
      symmetry_air_coeff: 0.1

      # Energy
      energy_coeff: 2e-5

    terminal_state_type: HeightBasedTerminalStateHandler
    terminal_state_params:
      min_height: 0.0
      max_height: 2.0

  # === REDUCED TRAINING PARAMETERS FOR QUICK CHECK ===
  hidden_layers: [256, 128]        # Smaller network (was [512, 256, 128])
  lr: 5e-5                         # Learning rate (also at root level)
  num_envs: 512                    # Fewer envs (was 2048)
  num_steps: 64
  total_timesteps: 2e5             # 200K instead of 20M (~10 min vs 3-4 hrs)
  update_epochs: 4
  num_minibatches: 16              # Fewer minibatches (was 32)
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.6
  learnable_std: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  activation: tanh
  anneal_lr: false                 # Don't anneal for quick check
  weight_decay: 0.0
  normalize_env: true
  debug: false
  live_wandb: true
  live_wandb_interval: 1           # Log every update for quick feedback
  n_seeds: 1
  vmap_across_seeds: true
  validation:
    active: false
    num: 1                       # Required even when active=false
    num_steps: 100
    num_envs: 10
