# Quick-check config for fast sanity runs.
# Use with: python experiment.py --config-name conf_quickcheck

defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic

wandb:
  project: "wildrobot-quickcheck"

experiment:
  task_factory:
    name: RLFactory
    params: {}
  env_params:
    env_name: MjxWildRobot
    horizon: 600
    terminal_state_type: HeightBasedTerminalStateHandler
    terminal_state_params:
      # Widen bounds to avoid immediate resets on first step
      min_height: 0.0
      max_height: 2.0
    goal_type: GoalRandomRootVelocity
    goal_params:
      visualize_goal: true
      max_x_vel: 1.2
      max_y_vel: 0.2
      max_yaw_vel: 0.3
    headless: true
    reward_type: LocomotionReward
    reward_params:
      tracking_w_exp_xy: 6.0
      tracking_w_exp_yaw: 4.0
      tracking_w_sum_xy: 3.5
      tracking_w_sum_yaw: 1.0
      air_time_coeff: 0.1
      joint_acc_coeff: 2.0e-05
      air_time_max: 0.5
      joint_torque_coeff: 2.0e-07
      joint_position_limit_coeff: 2.0
      action_rate_coeff: 0.02
      symmetry_air_coeff: 0.005
      energy_coeff: 1.0e-05
  hidden_layers: [512, 256]
  lr: 1e-4
  num_envs: 512
  num_steps: 64
  total_timesteps: 1e6        # ~30 updates at these settings; finishes quickly
  update_epochs: 2            # speed up
  num_minibatches: 32
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.8
  learnable_std: true
  ent_coef: 0.0               # consider 0.01 if exploration seems low
  vf_coef: 0.5
  max_grad_norm: 0.5
  activation: tanh
  anneal_lr: false
  weight_decay: 0.0
  normalize_env: true
  debug: false
  live_wandb: true
  live_wandb_interval: 1      # log every update for quick inspection
  n_seeds: 1
  vmap_across_seeds: true
  validation:
    active: false
    num_steps: 100
    num_envs: 100
    num: 10
