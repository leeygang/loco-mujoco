# Training configuration for WildRobot with NOISY IMU sensors
# This demonstrates teacher-student learning:
#   - Student observations: Noisy IMU (matches real robot)
#   - Teacher observations: Perfect state (simulation only)

# Environment
env_name: "MjxWildRobot"

# Observation specification with teacher-student pattern
observation_specification:
  # === STUDENT OBSERVATIONS (used on real robot) ===
  # Noisy physical IMU sensors
  - type: "IMUSensor"
    obs_name: "chest_imu"
    sensor_names: ["chest_imu_gyro", "chest_imu_accel", "chest_imu_mag"]
    group: "student"

  - type: "IMUSensor"
    obs_name: "left_knee_imu"
    sensor_names: ["left_knee_imu_gyro", "left_knee_imu_accel"]
    group: "student"

  - type: "IMUSensor"
    obs_name: "right_knee_imu"
    sensor_names: ["right_knee_imu_gyro", "right_knee_imu_accel"]
    group: "student"

  # Joint states (available on real robot)
  - type: "JointPosArray"
    obs_name: "joint_pos"
    xml_names: [
      "right_hip_pitch", "right_hip_roll", "right_knee_pitch",
      "right_ankle_pitch", "right_foot_roll",
      "left_hip_pitch", "left_hip_roll", "left_knee_pitch",
      "left_ankle_pitch", "left_foot_roll",
      "waist_yaw"
    ]
    group: "student"

  - type: "JointVelArray"
    obs_name: "joint_vel"
    xml_names: [
      "right_hip_pitch", "right_hip_roll", "right_knee_pitch",
      "right_ankle_pitch", "right_foot_roll",
      "left_hip_pitch", "left_hip_roll", "left_knee_pitch",
      "left_ankle_pitch", "left_foot_roll",
      "waist_yaw"
    ]
    group: "student"

  # === TEACHER OBSERVATIONS (simulation only, for faster learning) ===
  # Perfect state information (not available on real robot)
  - type: "BodyVel"
    obs_name: "pelvis_vel_perfect"
    xml_name: "waist"
    group: "teacher"

  - type: "ProjectedGravityVector"
    obs_name: "gravity_perfect"
    xml_name: "waist_freejoint"
    group: "teacher"

  # === COMMON OBSERVATIONS ===
  - type: "LastAction"
    obs_name: "last_action"

# Reward and goal
reward_type: "LocomotionReward"
goal_type: "GoalRandomRootVelocity"

# Goal configuration
goal_configuration:
  min_height: 0.0
  max_height: 2.0
  min_forward_vel: 0.0
  max_forward_vel: 3.0
  min_lateral_vel: -0.5
  max_lateral_vel: 0.5

# Training parameters
num_envs: 2048
horizon: 600
num_updates: 2000  # More updates for noisy observations

# PPO hyperparameters
ppo:
  num_minibatches: 16
  num_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  ent_coef: 0.01  # Slightly higher for exploration with noisy obs
  vf_coef: 0.5
  max_grad_norm: 1.0
  normalize_advantages: true

# Agent network
agent:
  init_std: 0.8
  actor_hidden_layer_sizes: [256, 256]
  critic_hidden_layer_sizes: [256, 256]
  activation: "tanh"

# Learning rate
learning_rate: 3e-4
anneal_lr: true

# Logging
track: true
wandb_project_name: "wildrobot-noisy-imu"
exp_name: "wildrobot_noisy_imu_ppo"

# Video recording
video:
  record: true
  n_steps: 200
  n_envs: 10

# Validation
validation:
  num: 1
  interval: 100

# Notes
notes: |
  This config uses NOISY IMU sensors that match real WildRobot hardware:
  - BNO085 (chest): gyro noise=0.0002 rad/s, accel noise=0.0015 m/s²
  - ICM45686 (knees): gyro noise=0.00005 rad/s, accel noise=0.0008 m/s²

  Teacher-student approach:
  - Training: Use both noisy IMU (student) + perfect state (teacher)
  - Deployment: Use only noisy IMU (student) on real robot
  - Benefit: Faster training + robust deployment
