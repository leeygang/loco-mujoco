# STEP 1 (Medium Speed): Intermediate stepping stone
# Goal: 0.5-1.0 m/s (between original and fast)

defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic

wandb:
  project: "wildrobot-medium-walking-step1"

lr: 3e-4

experiment:
  task_factory:
    name: RLFactory
    params: {}

  env_params:
    env_name: MjxWildRobot
    horizon: 600
    headless: true

    initial_state_type: DefaultInitialStateHandler
    initial_state_params: {}

    goal_type: GoalForwardRootVelocity
    goal_params:
      visualize_goal: false
      min_x_vel: 0.5     # Between 0.3 and 0.6
      max_x_vel: 1.0     # Between 0.8 and 1.2
      min_y_vel: -0.1
      max_y_vel: 0.1
      min_yaw_vel: -0.2
      max_yaw_vel: 0.2

    reward_type: LocomotionReward
    reward_params:
      tracking_w_exp_xy: 15.0
      tracking_w_exp_yaw: 4.0
      tracking_w_sum_xy: 5.0
      tracking_w_sum_yaw: 1.0
      z_vel_coeff: 2.0
      roll_pitch_vel_coeff: 0.08
      roll_pitch_pos_coeff: 0.3
      nominal_joint_pos_coeff: 0.005
      joint_position_limit_coeff: 5.0
      joint_vel_coeff: 5e-5
      joint_acc_coeff: 2e-5
      joint_torque_coeff: 2e-7
      action_rate_coeff: 0.02
      air_time_max: 0.15
      air_time_coeff: 0.15
      symmetry_air_coeff: 0.08
      energy_coeff: 2e-5

    terminal_state_type: HeightBasedTerminalStateHandler
    terminal_state_params:
      min_height: 0.2
      max_height: 0.6

  hidden_layers: [512, 256, 128]
  num_envs: 2048
  num_steps: 64
  total_timesteps: 2e7
  update_epochs: 4
  num_minibatches: 32
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.6
  learnable_std: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  activation: tanh
  anneal_lr: true
  weight_decay: 0.0
  normalize_env: true
  debug: false
  live_wandb: true
  live_wandb_interval: 5
  n_seeds: 1
  vmap_across_seeds: true
  validation:
    active: false
