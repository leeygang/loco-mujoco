defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic

wandb:
  project: "wildrobot-amp-amass"

experiment:
  task_factory:
    name: ImitationFactory
    params:
      # AMASS datasets - will be retargeted to WildRobot on first run
      amass_dataset_conf:
        rel_dataset_path:
          - "KIT/3/walking_slow08_poses"
          - "KIT/3/walking_medium03_poses"
          - "KIT/3/walking_fast01_poses"
          - "KIT/10/running_fast01_poses"

  env_params:
    env_name: MjxWildRobot
    horizon: 600
    headless: true

    # Goal and reward for AMP
    goal_type: GoalTrajRootVelocity
    goal_params:
      visualize_goal: false

    reward_type: TargetVelocityTrajReward
    reward_params:
      w_exp: 10.0

    # Terminal state
    terminal_state_type: HeightBasedTerminalStateHandler
    terminal_state_params:
      min_height: 0.0
      max_height: 2.0

  # Training hyperparameters
  hidden_layers: [256, 256]
  lr: 3e-4
  disc_lr: 5e-5
  num_envs: 2048
  num_steps: 20
  total_timesteps: 3e6
  update_epochs: 4
  disc_minibatch_size: 2048
  proportion_env_reward: 0.5
  n_disc_epochs: 50
  num_minibatches: 16
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.8
  learnable_std: true
  ent_coef: 0.01
  disc_ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 1.0
  activation: tanh
  anneal_lr: true
  normalize_env: true
  debug: false
  live_wandb: true
  live_wandb_interval: 10
  n_seeds: 1
  vmap_across_seeds: false
  validation_interval: 10
  validation:
    active: true
    num_steps: 200
    num_envs: 10
    num: 1
