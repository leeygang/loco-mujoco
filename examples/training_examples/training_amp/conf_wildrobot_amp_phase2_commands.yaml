defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic

wandb:
  project: "wildrobot-amp-phase2-commands"

# Top-level learning rates (accessed by optimizer)
lr: 3e-4
disc_lr: 5e-5

experiment:
  task_factory:
    name: ImitationFactory
    params:
      # AMASS datasets - include standing/idle for commands
      amass_dataset_conf:
        rel_dataset_path:
          # Standing/idle (for "stop" command)
          # Note: Check if you have these, otherwise use balancing motions
          - "KIT/3/balancing01_poses"  # Can act as standing
          # - "KIT/3/standing01_poses"  # Uncomment if you have this

          # Walking at different speeds
          - "KIT/3/walking_slow08_poses"
          - "KIT/3/walking_medium03_poses"
          - "KIT/3/walking_fast02_poses"
          - "KIT/3/walking_run03_poses"

          # Turning motions (in-place turns)
          - "KIT/3/turn_left01_poses"
          - "KIT/3/turn_right01_poses"

  env_params:
    env_name: MjxWildRobot
    horizon: 1000  # Longer episodes for command following
    headless: true

    # PHASE 2 CHANGE: Command-based goal instead of trajectory following
    goal_type: GoalRandomRootVelocity  # Random velocity commands
    goal_params:
      # Command velocity ranges (will sample from these)
      forward_velocity_range: [0.0, 2.0]   # 0=stop, 2.0=fast
      lateral_velocity_range: [0.0, 0.0]   # No lateral movement
      angular_velocity_range: [-0.5, 0.5]  # -0.5=turn right, +0.5=turn left

    reward_type: TargetVelocityGoalReward  # Track commanded velocity
    reward_params:
      tracking_w_exp_xy: 10.0
      tracking_w_exp_yaw: 10.0

    # Terminal state
    terminal_state_type: HeightBasedTerminalStateHandler
    terminal_state_params:
      min_height: 0.0
      max_height: 2.0

  # Training hyperparameters
  hidden_layers: [256, 256]
  lr: 3e-4
  disc_lr: 5e-5
  num_envs: 2048
  num_steps: 20
  total_timesteps: 5e6  # More timesteps for command learning
  update_epochs: 4
  disc_minibatch_size: 2048
  proportion_env_reward: 0.5
  n_disc_epochs: 50
  num_minibatches: 16
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.8
  learnable_std: true
  ent_coef: 0.01
  disc_ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 1.0
  activation: tanh
  anneal_lr: true
  weight_decay: 0.0001
  normalize_env: true
  debug: false
  live_wandb: true
  live_wandb_interval: 10
  n_seeds: 1
  vmap_across_seeds: false
  validation_interval: 10
  validation:
    active: true
    num_steps: 200
    num_envs: 10
    num: 1
    quantities:
      - JointPosition
      - JointVelocity
      - RelSitePosition
      - RelSiteVelocity
      - RelSiteOrientation
    measures:
      - EuclideanDistance
      - DynamicTimeWarping
      - DiscreteFrechetDistance
    rel_site_names:
      - pelvis_mimic
      - left_foot_mimic
      - right_foot_mimic
    joints_to_ignore:
      - pelvis_tx
      - pelvis_ty
      - pelvis_tz
      - pelvis_tilt
      - pelvis_list
      - pelvis_rotation
