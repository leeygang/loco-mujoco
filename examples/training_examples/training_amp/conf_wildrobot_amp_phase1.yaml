defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic

wandb:
  project: "wildrobot-amp-phase1"

experiment:
  task_factory:
    name: ImitationFactory
    params:
      # Dataset configuration - will auto-download from HuggingFace
      default_dataset_conf:
        datasets: ["walk", "run"]

  env_params:
    env_name: MjxWildRobot
    horizon: 600
    headless: true

    # Goal and reward for AMP
    goal_type: GoalTrajMimic
    goal_params: {}

    reward_type: AMPReward
    reward_params:
      task_reward_weight: 0.5
      style_reward_weight: 0.5

    # Terminal state
    terminal_state_type: HeightBasedTerminalStateHandler
    terminal_state_params:
      min_height: 0.0
      max_height: 2.0

  # Training hyperparameters
  hidden_layers: [256, 256]
  lr: 3e-4
  num_envs: 2048
  num_steps: 20
  total_timesteps: 3e6
  update_epochs: 4
  num_minibatches: 16
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.8
  learnable_std: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 1.0
  activation: tanh
  anneal_lr: true
  normalize_env: true
  debug: false
  live_wandb: true
  live_wandb_interval: 10
  n_seeds: 1
  vmap_across_seeds: false
  validation:
    active: true
    num_steps: 200
    num_envs: 10
    num: 1
