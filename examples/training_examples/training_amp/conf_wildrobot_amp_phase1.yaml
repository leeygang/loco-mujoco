# WildRobot AMP Training - Phase 1: Human-like Walking
# This config trains the robot to walk with human-like motion using AMP

# Environment
env_name: "MjxWildRobot"

# Observation specification for AMP
observation_specification:
  # === STUDENT OBSERVATIONS (noisy, for real robot deployment) ===
  - type: "IMUSensor"
    obs_name: "chest_imu"
    sensor_names: ["chest_imu_gyro", "chest_imu_accel", "chest_imu_mag"]
    group: "student"

  - type: "IMUSensor"
    obs_name: "left_knee_imu"
    sensor_names: ["left_knee_imu_gyro", "left_knee_imu_accel"]
    group: "student"

  - type: "IMUSensor"
    obs_name: "right_knee_imu"
    sensor_names: ["right_knee_imu_gyro", "right_knee_imu_accel"]
    group: "student"

  - type: "JointPosArray"
    obs_name: "joint_pos"
    xml_names: [
      "right_hip_pitch", "right_hip_roll", "right_knee_pitch",
      "right_ankle_pitch", "right_foot_roll",
      "left_hip_pitch", "left_hip_roll", "left_knee_pitch",
      "left_ankle_pitch", "left_foot_roll",
      "waist_yaw"
    ]
    group: "student"

  - type: "JointVelArray"
    obs_name: "joint_vel"
    xml_names: [
      "right_hip_pitch", "right_hip_roll", "right_knee_pitch",
      "right_ankle_pitch", "right_foot_roll",
      "left_hip_pitch", "left_hip_roll", "left_knee_pitch",
      "left_ankle_pitch", "left_foot_roll",
      "waist_yaw"
    ]
    group: "student"

  # === TEACHER OBSERVATIONS (perfect, for discriminator) ===
  - type: "RelativeSiteQuantaties"
    obs_name: "mimic_obs"
    group: "teacher"

  - type: "ProjectedGravityVector"
    obs_name: "gravity"
    xml_name: "waist_freejoint"
    group: "teacher"

  # === COMMON OBSERVATIONS ===
  - type: "GoalTrajMimic"
    obs_name: "goal"

  - type: "LastAction"
    obs_name: "last_action"

# Datasets - Load mocap for human-like motion
default_dataset_conf:
  datasets: ["walk", "run"]  # Basic walking and running motions

# You can also add LAFAN1 dataset for more variety:
# lafan1_dataset_conf:
#   datasets: ["walk1_subject1", "walk2_subject1", "run1_subject1"]

# Reward and goal
reward_type: "AMPReward"  # AMP-style reward (task + style)
goal_type: "GoalTrajMimic"  # Follow trajectory velocities

# AMP-specific reward configuration
amp_reward:
  task_reward_weight: 0.5    # Weight for task reward (reach goal)
  style_reward_weight: 0.5   # Weight for style reward (look human)
  discriminator_replay_buffer_size: 100000

# Training parameters
num_envs: 2048      # Parallel environments (GPU)
horizon: 600        # Max steps per episode
num_updates: 5000   # Phase 1: Learn basic motions

# AMP hyperparameters
amp:
  num_minibatches: 16
  num_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 1.0
  normalize_advantages: true

  # Discriminator settings
  discriminator_hidden_layer_sizes: [256, 256]
  discriminator_learning_rate: 1e-4
  discriminator_batch_size: 512

# Agent network
agent:
  init_std: 0.8
  actor_hidden_layer_sizes: [256, 256]
  critic_hidden_layer_sizes: [256, 256]
  activation: "tanh"

# Learning rate
learning_rate: 3e-4
anneal_lr: true

# Logging
track: true
wandb_project_name: "wildrobot-amp-phase1"
exp_name: "wildrobot_amp_humanlike_walking"

# Video recording
video:
  record: true
  n_steps: 200
  n_envs: 10

# Validation
validation:
  num: 1
  interval: 100

# Checkpoint saving
save_checkpoints: true
checkpoint_interval: 500

# Notes
notes: |
  Phase 1: Learning human-like walking with AMP
  - Uses mocap data for natural motion
  - Noisy IMU sensors for sim-to-real
  - Discriminator ensures human-like style
  - Goal: Natural walking/running gaits
