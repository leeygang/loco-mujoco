# WildRobot AMP Training with AMASS Human Motion Data
# Trains robot to walk with human-like gait using Adversarial Motion Priors
#
# Prerequisites:
#   1. Download AMASS dataset (KIT subset recommended)
#   2. Download SMPL models
#   3. Run setup commands:
#      loco-mujoco-set-amass-path --path /path/to/amass
#      loco-mujoco-set-smpl-model-path --path /path/to/smpl
#
# Usage:
#   cd examples/training_examples/jax_amp
#   python experiment.py --config-name conf_wildrobot_amp_amass

defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic

wandb:
  project: "wildrobot-amp-amass"

experiment:
  task_factory:
    name: ImitationFactory
    params:
      # AMASS human motion dataset - automatically retargeted to WildRobot
      # Retargeting handles size differences automatically!
      default_dataset_conf:
        dataset_names:
          - walk    # Standard walking motion (~0.8-1.2 m/s)
          - run     # Running motion (~2.0-3.0 m/s)
          # Available: walk, run, pace, trot, crawl, sit, etc.

      # Optional: Use specific AMASS sequences for more control
      # Uncomment to use custom sequences instead of default datasets
      # amass_dataset_conf:
      #   rel_dataset_path:
      #     # Walking at different speeds
      #     - "KIT/3/walking_slow08_poses"      # ~0.5 m/s
      #     - "KIT/3/walking_medium03_poses"    # ~1.0 m/s
      #     - "KIT/3/walking_fast02_poses"      # ~1.5 m/s
      #     - "KIT/3/walking_run03_poses"       # ~2.0 m/s
      #     # Turning motions
      #     - "KIT/3/turn_left01_poses"
      #     - "KIT/3/turn_right01_poses"

  env_params:
    env_name: MjxWildRobot
    horizon: 600
    headless: true

    # Goal: Track the velocity from expert trajectory
    goal_type: GoalTrajRootVelocity
    goal_params:
      visualize_goal: false

    # Reward: Track trajectory velocity (task reward)
    reward_type: TargetVelocityTrajReward
    reward_params:
      w_exp: 10.0      # Velocity tracking weight

    # Terminal state: Height-based fall detection
    terminal_state_type: HeightBasedTerminalStateHandler
    terminal_state_params:
      min_height: 0.15   # Fall if robot drops below 15cm
      max_height: 0.8    # Safety upper bound

  # ========== AMP HYPERPARAMETERS ==========

  # Balance between task reward (velocity) and style reward (discriminator)
  proportion_env_reward: 0.5   # 50% task, 50% style
  # Increase to 0.7 if you want more velocity tracking
  # Decrease to 0.3 if you want more human-like motion

  # Discriminator settings
  disc_lr: 5e-5                # Discriminator learning rate
  disc_minibatch_size: 2048    # Discriminator batch size (reduce to 1024 for 12GB GPU)
  n_disc_epochs: 50            # Discriminator update epochs per PPO update

  # ========== PPO HYPERPARAMETERS ==========

  hidden_layers: [256, 256]    # Policy network architecture
  lr: 3e-4                     # Policy learning rate

  # Environment configuration
  num_envs: 2048               # Parallel environments (REDUCE to 1024 for 12GB GPU)
  num_steps: 20                # Steps per rollout
  total_timesteps: 50e6        # Total training steps (50M ~= 30min on RTX 3080)

  # PPO update settings
  update_epochs: 4             # Policy update epochs per rollout
  num_minibatches: 16          # Number of minibatches (reduce to 8 for 12GB GPU)

  # PPO coefficients
  gamma: 0.99                  # Discount factor
  gae_lambda: 0.95             # GAE lambda
  clip_eps: 0.2                # PPO clipping epsilon
  ent_coef: 0.01               # Entropy coefficient (exploration)
  disc_ent_coef: 0.0           # Discriminator entropy
  vf_coef: 0.5                 # Value function coefficient
  max_grad_norm: 1.0           # Gradient clipping

  # Policy initialization
  init_std: 0.8                # Initial action std (higher = more exploration)
  learnable_std: true          # Learn action std over time

  # Optimization
  activation: tanh             # Activation function
  anneal_lr: true              # Anneal learning rate linearly to 0
  weight_decay: 0.0001         # Weight decay (L2 regularization)

  # Environment normalization
  normalize_env: true          # Normalize observations

  # Logging
  debug: false
  live_wandb: true             # Stream metrics to W&B during training
  live_wandb_interval: 10      # Log every 10 updates

  # Multi-seed training
  n_seeds: 1                   # Number of random seeds (set >1 for ablations)
  vmap_across_seeds: false     # Vectorize across seeds (set true if n_seeds > 1)

  # ========== VALIDATION ==========

  validation_interval: 10      # Validate every N updates
  validation:
    active: true               # Enable validation metrics
    num_steps: 200             # Steps per validation episode
    num_envs: 10               # Parallel validation environments
    num: 1                     # Number of validation runs

    # Trajectory tracking metrics
    quantities:
      - JointPosition
      - JointVelocity
      - RelSitePosition
      - RelSiteVelocity
      - RelSiteOrientation

    measures:
      - EuclideanDistance
      - DynamicTimeWarping
      - DiscreteFrechetDistance

    # Sites to track for validation (defined in WildRobot.yaml)
    rel_site_names:
      - pelvis_mimic
      - left_foot_mimic
      - right_foot_mimic

    # Ignore root joint for metrics (we only care about joint angles)
    joints_to_ignore:
      - pelvis_tx
      - pelvis_ty
      - pelvis_tz
      - pelvis_tilt
      - pelvis_list
      - pelvis_rotation
