# STEP 2: Add Human-Like Motion with AMP (AFTER Step 1 works)
# Uses AMPJax algorithm (not PPOJax)
# Run with: python experiment_amp.py --config-name conf_step2_humanlike_amp

defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic

wandb:
  project: "wildrobot-humanlike-amp"

experiment:
  # Custom expert data path (converted from Step 1 HDF5 output)
  custom_expert_path: "../jax_rl/wildrobot_expert_traj.npz"

  task_factory:
    name: RLFactory  # Use RLFactory since we load trajectory manually
    params: {}

  env_params:
    env_name: MjxWildRobot
    horizon: 600
    headless: true

    # DEFAULT INITIALIZATION (no RSI - same as Step 1)
    initial_state_type: DefaultInitialStateHandler
    initial_state_params: {}

    # FORWARD VELOCITY GOAL (same as Step 1)
    goal_type: GoalForwardRootVelocity
    goal_params:
      visualize_goal: false
      min_x_vel: 0.3
      max_x_vel: 0.8
      min_y_vel: -0.1
      max_y_vel: 0.1
      min_yaw_vel: -0.2
      max_yaw_vel: 0.2

    # TASK REWARD (LocomotionReward, NOT AMPReward!)
    # AMP discriminator adds style reward automatically
    reward_type: LocomotionReward
    reward_params:
      # Velocity tracking (same as Step 1)
      tracking_w_exp_xy: 15.0
      tracking_w_exp_yaw: 4.0
      tracking_w_sum_xy: 5.0
      tracking_w_sum_yaw: 1.0

      # Stability
      z_vel_coeff: 2.0
      roll_pitch_vel_coeff: 0.08
      roll_pitch_pos_coeff: 0.3

      # Smooth motion
      nominal_joint_pos_coeff: 0.005
      joint_position_limit_coeff: 5.0
      joint_vel_coeff: 5e-5
      joint_acc_coeff: 2e-5
      joint_torque_coeff: 2e-7
      action_rate_coeff: 0.02

      # Gait pattern
      air_time_max: 0.15
      air_time_coeff: 0.15
      symmetry_air_coeff: 0.08

      # Energy
      energy_coeff: 2e-5

    terminal_state_type: HeightBasedTerminalStateHandler
    terminal_state_params:
      min_height: 0.2
      max_height: 0.6

  # === AMP-SPECIFIC PARAMETERS ===
  proportion_env_reward: 0.5      # 50% task reward, 50% discriminator reward
  disc_lr: 5e-5                   # Discriminator learning rate
  disc_minibatch_size: 1024       # Discriminator batch size (reduced for 12GB GPU)
  n_disc_epochs: 50               # Discriminator update epochs

  # === TRAINING PARAMETERS ===
  hidden_layers: [512, 256, 128]
  lr: 3e-4                        # Policy learning rate
  num_envs: 1024                  # Reduced for 12GB GPU (was 2048)
  num_steps: 64
  total_timesteps: 2e7
  update_epochs: 4
  num_minibatches: 16             # Reduced to match smaller num_envs
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.6
  learnable_std: true
  ent_coef: 0.01
  disc_ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  activation: tanh
  anneal_lr: true
  weight_decay: 0.0
  normalize_env: true
  debug: false
  live_wandb: true
  live_wandb_interval: 5
  n_seeds: 1
  vmap_across_seeds: true
  validation:
    active: false
    num: 1
    num_steps: 100
    num_envs: 10
